- version: v0.14.0
  date: '2026-04-24'
  breaking: true
  highlights:
  - Feedback renamed to Score across SDK, GraphQL API, and database (FeedbackType -> ScoreType).
  - feedback.* SDK/GraphQL API removed in favor of score.* / metrics.*.
  - Legacy judge entity removed; migrate to graders (function/prebuilt/judge-as-grader).
  - New response_format field (plain text, JSON Schema, or Pydantic) for structured output.
  - New function grader type running a sandboxed Python grade function.
  - New REST types ResponseFormat, Jobs.delete, Jobs.update, validate_function_grader.
- version: v0.13.0
  date: '2026-03-02'
  breaking: true
  highlights:
  - '"Use Cases" renamed to "Projects" across SDK, GraphQL API, REST API, and URL paths.'
  - feedback.link()/unlink() removed; metrics are now project-scoped.
  - New client.create_service_account() method.
  - New built-in recipe for speculative-decoding draft-model alignment.
