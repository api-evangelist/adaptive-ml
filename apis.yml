aid: adaptive-ml
name: Adaptive ML
description: >-
  Adaptive ML builds Adaptive Engine, an enterprise platform for developing,
  evaluating, and serving specialized open-source large language models via
  reinforcement-learning post-training. The three-phase workflow (Adapt,
  Evaluate, Serve) lets teams fine-tune smaller models to outperform commercial
  APIs, measure them with custom AI judges and graders, and feed production
  signals back into training. Adaptive Engine is self-hosted (Kubernetes/Helm)
  and exposes an OpenAI-compatible REST API for chat completions and embeddings,
  plus interactions, comparisons, outcomes, dataset/recipe management, and
  chunked uploads. Tooling includes the Python adaptive-sdk and adaptive-harmony
  libraries and the adpt CLI. Adaptive ML was acquired by Datadog.
